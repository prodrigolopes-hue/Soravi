services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soravi
      POSTGRES_PASSWORD: soravi
      POSTGRES_DB: soravi
    ports: ["5432:5432"]
    volumes: ["soravi_postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  soravi_postgres_data:
